server:
  port: 8080

spring:
  application:
    name: rpg-backend
    
  datasource:
    url: jdbc:postgresql://localhost:5432/rpgdb
    username: rpguser
    password: rpgpass
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.rpggame: DEBUG
    org.hibernate.SQL: DEBUG